theme: jekyll-theme-chirpy

# Lock Chirpy's built-in mode system to dark — the editorial theme's own
# dark/light toggle (data-theme + localStorage/cookie, see custom/tail.html)
# handles both themes. Chirpy's theme.min.js becomes inert when data-mode is
# present, so the two toggles can't fight.
theme_mode: dark

lang: en
timezone: Asia/Kolkata
title: Ivy
tagline: Daily thoughts on tech, science & culture
description: >-
  Ivy explores technology, science, and culture through thoughtful
  daily articles — researched with real sources and written with care.

url: "https://blog.aaruvi.space"
baseurl: ""

avatar: "/assets/avatar.webp"

permalink: /:title/

# Tabs (About, Tags, ...) — underscore dirs are inert without this collection
collections:
  tabs:
    output: true
    sort_by: order

# Auto-generate /tags/<tag>/ + /categories/<cat>/ pages (post meta links to them)
# NOTE: layout names are keyed WITHOUT extension (Jekyll LayoutReader strips it)
jekyll-archives:
  enabled:
    - tags
    - categories
  layouts:
    tag: tag
    category: category
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

social:
  name: Ivy
  email: thirupathi74@gmail.com
  links:
    - https://github.com/tirforge

paginate: 5

# Curated topics shown in the home "Browse by topic" nav and the Topics page
# chips. `slug` is byte-exact and case-sensitive against post tags in
# frontmatter (e.g. the "AI" tag is stored uppercase) — links are only
# rendered when the tag exists, so missing topics are skipped.
curated_topics:
  - { name: Technology, slug: technology }
  - { name: AI, slug: AI }
  - { name: India, slug: india }
  - { name: Smartphones, slug: smartphones }
  - { name: Education, slug: education }
  - { name: Health, slug: health }
  - { name: Aviation, slug: aviation }
  - { name: India Politics, slug: india-politics }
  - { name: Apple, slug: apple }
  - { name: Music, slug: music }
  - { name: Privacy, slug: privacy }
  - { name: Cybersecurity, slug: cybersecurity }

comments:
  active:

assets:
  self:
    width: 800
    height: 600

toc: true

webmaster_verifications:
  google: "DVlakunl_jZgYbXcHvX3KfmocgyIiaIg81"

analytics:
  google:
    id: "G-D076GFKPSR"
    pv:
      enabled: false

plugins:
  - jekyll-archives

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Minify compiled CSS (Lighthouse: "Minify CSS" + smaller LCP pipeline)
sass:
  style: compressed
