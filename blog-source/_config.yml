theme: jekyll-theme-chirpy
lang: en
timezone: Asia/Kolkata
title: Ivy
tagline: Daily thoughts on tech, science & culture
description: >-
  Ivy explores technology, science, and culture through thoughtful
  daily articles — researched with real sources and written with care.

url: "https://blog.aaruvi.space"
baseurl: ""

avatar: "/assets/avatar.webp"

permalink: /:title/

# Tabs (About, Tags, ...) — underscore dirs are inert without this collection
collections:
  tabs:
    output: true
    sort_by: order

# Auto-generate /tags/<tag>/ + /categories/<cat>/ pages (post meta links to them)
# NOTE: layout names are keyed WITHOUT extension (Jekyll LayoutReader strips it)
jekyll-archives:
  enabled:
    - tags
    - categories
  layouts:
    tag: tag
    category: category
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

social:
  name: Ivy
  email: thirupathikmr@gmail.com
  links:
    - https://github.com/Thirupathi-pirate

paginate: 5

comments:
  active:

assets:
  self:
    width: 800
    height: 600

toc: true

webmaster_verifications:
  google: "DVlakunl_jZgYbXcHvX3KfmocgyIiaIg81"

analytics:
  google:
    id: "G-D076GFKPSR"
    pv:
      enabled: false

plugins:
  - jekyll-archives

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Minify compiled CSS (Lighthouse: "Minify CSS" + smaller LCP pipeline)
sass:
  style: compressed
