<!-- Editorial top navigation — wordmark + nav + theme toggle.
     Design source: opendesign/index.html (golden-standard editorial). -->
<header class="site-topnav" data-od-id="topnav">
  <div class="container topnav-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" rel="home">{{ site.title }}</a>

    <nav aria-label="Main navigation">
      <a
        href="{{ '/' | relative_url }}"
        class="{% if page.layout == 'home' %}active{% endif %}"
        {% if page.layout == 'home' %}aria-current="page"{% endif %}
      >Home</a>
      <a
        href="{{ '/tags/' | relative_url }}"
        class="{% if page.layout == 'tags' or page.layout == 'tag' or page.layout == 'categories' or page.layout == 'category' %}active{% endif %}"
        {% if page.layout == 'tags' or page.layout == 'tag' or page.layout == 'categories' or page.layout == 'category' %}aria-current="page"{% endif %}
      >Topics</a>
      <a
        href="{{ '/about/' | relative_url }}"
        class="{% if page.url contains '/about/' %}active{% endif %}"
        {% if page.url contains '/about/' %}aria-current="page"{% endif %}
      >About</a>
    </nav>

    <div class="topnav-right">
      <button
        class="theme-toggle"
        type="button"
        aria-pressed="false"
        aria-label="Toggle color theme"
      >
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" /></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </button>
    </div>
  </div>
</header>
