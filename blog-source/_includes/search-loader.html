<!--
  Jekyll Simple Search loader — site override of the Chirpy theme include.

  The theme initializes SimpleJekyllSearch on DOMContentLoaded, which eagerly
  fetches the (1MB+) search.json data file on every page load. This override
  defers initialization until the user first interacts with the search UI
  (click / keyboard / focus on the trigger or input), then removes the
  listeners so it initializes exactly once.
-->

{% capture result_elem %}
  <article class="px-1 px-sm-2 px-lg-4 px-xl-0">
    <header>
      <h2><a href="{url}">{title}</a></h2>
      <div class="post-meta d-flex flex-column flex-sm-row text-muted mt-1 mb-1">
        {categories}
        {tags}
      </div>
    </header>
    <p>{content}</p>
  </article>
{% endcapture %}

{% capture not_found %}<p class="mt-5">{{ site.data.locales[include.lang].search.no_results }}</p>{% endcapture %}

<script>
  {% comment %} Note: dependent library will be loaded in `js-selector.html` {% endcomment %}
  (function () {
    var TRIGGER = 'search-trigger';
    var INPUT = 'search-input';

    function initSearch() {
      var trigger = document.getElementById(TRIGGER);
      var input = document.getElementById(INPUT);
      if (trigger) {
        trigger.removeEventListener('click', initSearch);
        trigger.removeEventListener('keydown', initSearch);
      }
      if (input) {
        input.removeEventListener('focusin', initSearch);
      }
      document.removeEventListener('click', initSearch, true);
      document.removeEventListener('keydown', initSearch, true);

      if (typeof SimpleJekyllSearch === 'undefined' || !input) {
        return;
      }

      SimpleJekyllSearch({
        searchInput: input,
        resultsContainer: document.getElementById('search-results'),
        json: '{{ '/assets/js/data/search.json' | relative_url }}',
        searchResultTemplate: '{{ result_elem | strip_newlines }}',
        noResultsText: '{{ not_found }}',
        templateMiddleware: function(prop, value, template) {
          if (prop === 'categories') {
            if (value === '') {
              return `${value}`;
            } else {
              return `<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>${value}</div>`;
            }
          }

          if (prop === 'tags') {
            if (value === '') {
              return `${value}`;
            } else {
              return `<div><i class="fa fa-tag fa-fw"></i>${value}</div>`;
            }
          }
        }
      });
    }

    document.addEventListener('click', initSearch, true);
    document.addEventListener('keydown', initSearch, true);
  })();
</script>
