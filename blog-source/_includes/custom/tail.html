<!-- ── Theme toggle (design: opendesign/index.html) ──────────────────
     data-theme on <html>, persisted to localStorage `ivy-theme` AND a
     same-name cookie (cross-page fallback in sandboxed previews where
     localStorage is partitioned). pre-paint read lives in _includes/head.html. -->
<script>
(function () {
  var toggle = document.querySelector('.theme-toggle');
  if (!toggle) return;

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }

  function syncMeta() {
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    var computed = getComputedStyle(document.documentElement);
    var bg = computed.getPropertyValue('--bg').trim() || '#202A38';
    metas.forEach(function (meta) { meta.setAttribute('content', bg); });
  }

  function persistTheme(theme) {
    try { localStorage.setItem('ivy-theme', theme); } catch (e) {}
    try { document.cookie = 'ivy-theme=' + theme + ';path=/;max-age=31536000;samesite=Lax'; } catch (e) {}
  }

  function apply(theme, persist) {
    document.documentElement.setAttribute('data-theme', theme);
    toggle.setAttribute('aria-pressed', theme === 'light' ? 'true' : 'false');
    syncMeta();
    if (persist) { try { persistTheme(theme); } catch (e) {} }
  }

  apply(currentTheme(), false);

  toggle.addEventListener('click', function () {
    var next = currentTheme() === 'light' ? 'dark' : 'light';
    try {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { apply(next, true); return; }
      if (!document.startViewTransition) { apply(next, true); return; }
      document.startViewTransition(function () { apply(next, true); });
    } catch (e) { apply(next, true); }
  });
})();
</script>

<!-- ── Scroll reveals (transform-only; no opacity: 0; no-JS stays static) ── -->
<script>
(function () {
  if (!('IntersectionObserver' in window)) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var els = document.querySelectorAll('.reveal');
  if (!els.length) return;
  els.forEach(function (el) { el.classList.add('reveal-init'); });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        var el = entry.target;
        el.classList.add('is-visible');
        el.classList.remove('reveal-init');
        io.unobserve(el);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -5% 0px' });
  els.forEach(function (el) { io.observe(el); });
})();
</script>

<!-- ── Home feed search (filters .post-row) ─────────────────────────── -->
<script>
(function () {
  var input = document.getElementById('story-search');
  if (!input) return;
  var rows = Array.prototype.slice.call(document.querySelectorAll('.post-row'));
  var count = document.getElementById('search-count');
  var empty = document.getElementById('search-empty');
  function run() {
    var q = input.value.trim().toLowerCase();
    var n = 0;
    rows.forEach(function (row) {
      var hit = !q || row.textContent.toLowerCase().indexOf(q) !== -1;
      row.style.display = hit ? '' : 'none';
      if (hit) n++;
    });
    if (count) count.textContent = q ? (n + (n === 1 ? ' result' : ' results')) : (n + ' stories');
    if (empty) empty.hidden = n !== 0;
  }
  input.addEventListener('input', run);
})();
</script>

<!-- ── Reading progress (post pages) ────────────────────────────────── -->
<script>
(function () {
  var bar = document.querySelector('.reading-progress');
  if (!bar) return;
  var ticking = false;
  function update() {
    var doc = document.documentElement;
    var max = doc.scrollHeight - window.innerHeight;
    var p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    bar.style.transform = 'scaleX(' + p + ')';
    ticking = false;
  }
  function request() {
    if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
  }
  window.addEventListener('scroll', request, { passive: true });
  window.addEventListener('resize', request);
  update();
})();
</script>
