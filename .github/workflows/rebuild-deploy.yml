name: Rebuild & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'blog-source/**'
      - '.github/workflows/rebuild-deploy.yml'
  workflow_dispatch:

# Only one rebuild at a time — new pushes supersede in-progress builds
concurrency:
  group: rebuild-deploy
  cancel-in-progress: true

permissions:
  contents: write

env:
  RUBY_VERSION: '3.3'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: blog-source

      - name: Build Jekyll site
        run: JEKYLL_ENV=production bundle exec jekyll build
        working-directory: blog-source

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: blog-source/_site
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          cname: blog.aaruvi.space

      # Fail loudly on purge errors — the old `|| true` here hid a stale token
      # for weeks (see repair-posts.yml for the same fix). Zone ID is a secret
      # when set, falling back to the known production zone.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || '031c516ab46c1f7718dac0649f584501' }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}' | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('success'), d.get('errors'); print('purged:', d['result']['id'])"

      - name: Submit latest posts to IndexNow (Bing, Yandex, Seznam, Naver)
        run: python3 scripts/indexnow_submit.py --recent 5 --sitemap blog-source/_site/sitemap.xml

      - name: Submit sitemap to Google Search Console
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            python3 -m pip install --quiet google-auth >/dev/null 2>&1 || pip3 install --quiet google-auth
            python3 scripts/gsc_submit.py
          else
            echo "GSC_SERVICE_ACCOUNT_JSON not set — skipping Search Console submission"
          fi
